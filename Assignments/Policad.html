<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <h1>Student Registration Form</h1>
    <form action="/signup" method="post">
    <div>
    <label for="full-name">Full Name:</label>
    <input type="text" id="full-name" placeholder="Enter your full name" required minlength="2" maxlength="50" name="user-full-name">
    </div>
    <div>
    <label for="email">Email Address:</label>
    <input type="email" id="email" placeholder="Enter your email" required name="user-email">
    </div>
    <div>
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter your password" required name="user-password">
    </div>
    <div>
    <label for="city">City(Optional):</label>
    <input type="text" id="city" placeholder="Enter your city" name="user-city">
    </div>
    <div>
    <label>Gender:</label>
    <input type="radio" id="male" name="user-gender" value="user-male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="user-gender" value="user-female" checked>
    <label for="female">Female</label>
    </div>
    <div>
    <label for="roll-number">Roll Number:</label>
    <input  type="text" id="roll-number" name="user-roll-number" value="2616400" required placeholder="Enter your Roll number">
    </div>
    <div>
    <label for="country">Country:</label>
    <select  id="country" name="user-country">
        <option value="England">England</option>
        <option value="Australia">Australia</option>
        <option value="India" selected>India</option>
        <option value="USA">USA</option>
        <option value="Other">Other</option>
    </select>
    </div><br>
    <div>
    <label>Interested in:</label><br>

    <input type="checkbox" id="dsa" name="user-interests" value="dsa">
    <label for="dsa">DSA</label>

    <input type="checkbox" id="dev" name="user-interests" value="development">
    <label for="dev">Development</label>

    <input type="checkbox" id="ai" name="user-interests" value="ai">
    <label for="ai">AI</label>

    <input type="checkbox" id="Data" name="user-interests" value="data-science">
    <label for="Data">Data Science</label>

    <input type="checkbox" id="market" name="user-interests" value="marketing">
    <label for="market">Marketing</label>

    <input type="checkbox" id="pro" name="user-interests" value="product-design">
    <label for="pro">Product Design</label><br>

    </div>
    <div>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    </div>
    </form>
</body>
</html>
