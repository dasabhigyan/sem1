<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="/FSD/sem1/Day7/register.html" method="post">

         <label for="name">Type Your Name Here:</label>
        <input type="text" placeholder="Type your name here" id="name" name="name" value="Das" required minlength="2" maxlength="50"><br><br>

        <label for="pass">Enter Password</label>
        <input type="password" placeholder="Password" id="pass" name="password"><br><br>

        <label for="mail">Enter Your mail</label>
        <input type="email" placeholder="abc@example.com" id="mail" name="eamil" required><br><br>

        <label for="age">Age:</label>
        <input type="number" name="age" id="age" placeholder="69" min="0" max="100"><br><br>

        <label for="color">Choose Your Color</label>
        <input type="color" name="color" id="color"><br><br>

        <label for="dob">DOB</label>
        <input type="date" name="DOB" id="dob" ><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button><br><br>

        <input type="submit" value="Submit Your form">
        <input type="reset" value="Reset this form">

    </form>
</body>
</html>
